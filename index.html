<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page d'accueil</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 24px;
      font-weight: 600;
    }

    /* Barre de recherche Google */
    .search-box {
      width: 100%;
      max-width: 500px;
      margin-bottom: 32px;
    }

    .search-box input {
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      border: 1px solid #334155;
      background-color: var(--card-bg);
      color: var(--text-color);
      font-size: 1rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent-color);
    }

    /* Grille de raccourcis */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 500px;
    }

    .shortcut {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background-color: var(--card-bg);
      border-radius: 16px;
      text-decoration: none;
      color: var(--text-color);
      transition: transform 0.1s, background-color 0.2s;
    }

    .shortcut:active {
      transform: scale(0.95);
      background-color: #334155;
    }

    .shortcut span {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .shortcut p {
      font-size: 0.85rem;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <h1>Bonjour 👋</h1>

<!-- Barre de recherche avec exclusion automatique de Facebook et Instagram -->
<form class="search-box" action="https://www.google.com/search" method="GET">
  <input type="text" name="q" placeholder="Rechercher sur le Web..." required>
  <!-- Filtres masqués envoyés automatiquement à Google -->
  <input type="hidden" name="as_q" value="-site:facebook.com -site:instagram.com">
</form>

  <!-- Raccourcis -->
  <div class="grid">
    <a href="https://www.wikipedia.org" class="shortcut">
      <span>📚</span>
      <p>Wikipedia</p>
    </a>
    <a href="https://news.google.com" class="shortcut">
      <span>📰</span>
      <p>Actualités</p>
    </a>
    <a href="https://www.youtube.com" class="shortcut">
      <span>▶️</span>
      <p>YouTube</p>
    </a>
    <a href="https://github.com" class="shortcut">
      <span>💻</span>
      <p>GitHub</p>
    </a>
  </div>

</body>
</html>
